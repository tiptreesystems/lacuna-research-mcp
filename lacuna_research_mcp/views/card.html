<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Lacuna Research</title>
<style>
  html, body { margin: 0; background: transparent; }
  body {
    font-family: var(--font-sans, system-ui, sans-serif);
    font-size: var(--font-text-sm-size, 14px);
    line-height: var(--font-text-sm-line-height, 1.4);
    color: var(--color-text-primary, light-dark(#141413, #faf9f5));
    /* The host reports the edges its own controls cover, such as the reply box. */
    padding: var(--inset-top, 0px) var(--inset-right, 0px) var(--inset-bottom, 0px) var(--inset-left, 0px);
  }
  .card {
    box-sizing: border-box;
    padding: 14px 16px;
    border: var(--border-width-regular, 0.5px) solid
      var(--color-border-tertiary, light-dark(rgba(31, 30, 29, 0.15), rgba(222, 220, 209, 0.15)));
    border-radius: var(--border-radius-xl, 12px);
    background: var(--color-background-primary, light-dark(#ffffff, #30302e));
  }
  .source {
    display: flex; align-items: center; gap: 6px;
    font-size: var(--font-text-xs-size, 12px);
    font-weight: var(--font-weight-medium, 500);
    color: var(--color-text-secondary, light-dark(#3d3d3a, #c2c0b6));
    margin-bottom: 8px;
  }
  /* The Lacuna mark in its own colours: light and dark versions of the logo. */
  .mark { width: 16px; height: 16px; flex: none; }
  .mark .a { fill: #82a7a9; }
  .mark .b { fill: light-dark(#47696b, #c8dcdc); }
  .mark .c { fill: light-dark(#1a1a1a, #ffffff); }
  h1 {
    margin: 0 0 4px;
    font-size: var(--font-heading-md-size, 16px);
    line-height: var(--font-heading-md-line-height, 1.4);
    font-weight: var(--font-weight-semibold, 600);
    overflow-wrap: anywhere;
  }
  /* An author's photo sits beside the name. */
  .head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 2px; }
  .headline { min-width: 0; flex: 1; }
  .photo {
    width: 44px; height: 44px; flex: none; border-radius: 50%; object-fit: cover;
    background: var(--color-background-secondary, light-dark(#f5f4ed, #262624));
  }
  .byline {
    margin: 0 0 8px;
    color: var(--color-text-secondary, light-dark(#3d3d3a, #c2c0b6));
    overflow-wrap: anywhere;
  }
  .summary {
    margin: 0 0 12px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4;
    overflow: hidden;
  }
  .figures { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
  .figures.single { grid-template-columns: minmax(0, 1fr); }
  figure { margin: 0; min-width: 0; }
  /* Figures are drawn on white, so their tile stays white in dark mode too. */
  figure img {
    display: block; box-sizing: border-box; width: 100%; height: 150px; object-fit: contain;
    background: #ffffff; padding: 6px;
    border: var(--border-width-regular, 0.5px) solid
      var(--color-border-tertiary, light-dark(rgba(31, 30, 29, 0.15), rgba(222, 220, 209, 0.15)));
    border-radius: var(--border-radius-md, 8px);
  }
  figcaption {
    margin-top: 4px;
    font-size: var(--font-text-xs-size, 12px);
    color: var(--color-text-tertiary, light-dark(#73726c, #9c9a92));
    overflow-wrap: anywhere;
  }
  .listing { margin: 0 0 12px; }
  #short-list:has(+ .actions[hidden]) .listing { margin-bottom: 0; }
  .listing h2 {
    margin: 0 0 4px;
    font-size: var(--font-text-xs-size, 12px);
    font-weight: var(--font-weight-medium, 500);
    color: var(--color-text-secondary, light-dark(#3d3d3a, #c2c0b6));
  }
  .listing ul { list-style: none; margin: 0; padding: 0; }
  .listing li { padding: 2px 0; overflow-wrap: anywhere; }
  .listing .where { color: var(--color-text-tertiary, light-dark(#73726c, #9c9a92)); }
  a { color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button {
    font: inherit; cursor: pointer; min-height: 44px; padding: 0 14px;
    border-radius: var(--border-radius-md, 8px);
    font-weight: var(--font-weight-medium, 500);
  }
  button.primary {
    border: none;
    background: var(--color-background-inverse, light-dark(#141413, #faf9f5));
    color: var(--color-text-inverse, light-dark(#ffffff, #141413));
  }
  button.quiet {
    background: transparent;
    color: var(--color-text-primary, light-dark(#141413, #faf9f5));
    border: var(--border-width-regular, 0.5px) solid
      var(--color-border-secondary, light-dark(rgba(31, 30, 29, 0.3), rgba(222, 220, 209, 0.3)));
  }
  button:focus-visible {
    outline: 2px solid var(--color-ring-primary, light-dark(rgba(20, 20, 19, 0.7), rgba(250, 249, 245, 0.7)));
    outline-offset: 2px;
  }
  @media (min-width: 480px) { button { min-height: 36px; } }

  /* Expanded: the side panel or full screen. The page scrolls; the card is the page. */
  body.expanded .card {
    border: none; border-radius: 0; background: transparent;
    /* The bottom padding keeps the last lines clear of Claude's reply box. */
    max-width: 760px; margin: 0 auto; padding: 20px 20px 96px;
  }
  body.expanded h1 { font-size: var(--font-heading-xl-size, 24px); line-height: 1.25; }
  body.expanded .photo { width: 64px; height: 64px; }
  body.expanded .listing { font-size: var(--font-text-md-size, 16px); line-height: 1.55; margin: 0; }
  body.expanded .listing h2 {
    font-size: var(--font-heading-lg-size, 20px); line-height: 1.25; margin: 24px 0 8px;
    font-weight: var(--font-weight-semibold, 600);
    color: var(--color-text-primary, light-dark(#141413, #faf9f5));
  }
  body.expanded .figures { gap: 12px; margin: 16px 0; }
  body.expanded figure img { height: 220px; }
  body.expanded #figures figure img { height: 320px; }
  .article figure { margin: 16px 0; }
  body.expanded .article figure img { height: auto; max-height: 380px; }
  body.expanded .actions { margin: 4px 0 16px; }
  .article { font-size: var(--font-text-md-size, 16px); line-height: 1.55; overflow-wrap: anywhere; }
  .article h2 { font-size: var(--font-heading-lg-size, 20px); line-height: 1.25; margin: 24px 0 8px; }
  .article h3 { font-size: var(--font-heading-md-size, 16px); margin: 20px 0 6px; }
  .article p { margin: 0 0 12px; }
  .article ul, .article ol { margin: 0 0 12px; padding-left: 22px; }
  .article li { margin: 0 0 4px; }
  .article code, .article pre { font-family: var(--font-mono, ui-monospace, monospace); font-size: 0.9em; }
  .article pre {
    overflow-x: auto; padding: 10px 12px; margin: 0 0 12px;
    background: var(--color-background-secondary, light-dark(#f5f4ed, #262624));
    border-radius: var(--border-radius-md, 8px);
  }

  .skeleton span {
    display: block; height: 12px; margin: 8px 0; border-radius: 4px;
    background: var(--color-background-secondary, light-dark(#f5f4ed, #262624));
  }
  .skeleton span:nth-child(1) { width: 70%; height: 16px; }
  .skeleton span:nth-child(2) { width: 45%; }
  .skeleton span:nth-child(3) { width: 95%; }
  .skeleton span:nth-child(4) { width: 80%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="source">
    <svg class="mark" viewBox="68 42 370 440" aria-hidden="true">
      <polygon class="a" points="88,112 88,352 208,292 208,52"/>
      <polygon class="b" points="158,152 158,392 278,332 278,92"/>
      <polygon class="c" points="298,232 298,472 418,412 418,172"/>
    </svg>
    <span>Lacuna Research</span>
  </div>
  <div id="loading" class="skeleton" aria-label="Loading">
    <span></span><span></span><span></span><span></span>
  </div>
  <div id="entity" hidden>
    <div class="head">
      <img id="photo" class="photo" alt="" hidden>
      <div class="headline">
        <h1 id="title"></h1>
        <p id="byline" class="byline"></p>
      </div>
    </div>
    <p id="summary" class="summary"></p>
    <div id="figures" class="figures" hidden></div>
    <div id="short-list" hidden></div>
    <div id="actions" class="actions">
      <button id="open" class="primary" type="button">Open on Lacuna</button>
      <button id="expand" class="quiet" type="button" hidden>Read the summary</button>
    </div>
    <div id="article" class="article" hidden></div>
    <div id="more-figures" class="figures" hidden></div>
    <div id="full-list" hidden></div>
  </div>
</div>
<!-- MCP_APPS_CLIENT -->
<script type="module">
  // card_html() puts the MCP Apps client in the script above this one.
  const { App, applyDocumentTheme, applyHostFonts, applyHostStyleVariables } =
    globalThis.LacunaCardClient;

  const $ = (id) => document.getElementById(id);
  const LACUNA_ORIGIN = "https://lacuna.tiptreesystems.com";
  const MEDIA_ORIGIN = "https://media.lacuna.tiptreesystems.com";
  const INLINE_FIGURES = 2;
  const EXPANDED_FIGURES = 6;
  const VENUE_NAMES = {
    neurips: "NeurIPS", icml: "ICML", iclr: "ICLR", cvpr: "CVPR", iccv: "ICCV", eccv: "ECCV",
    acl: "ACL", emnlp: "EMNLP", naacl: "NAACL", aaai: "AAAI", tmlr: "TMLR", jmlr: "JMLR",
    colt: "COLT", aistats: "AISTATS", uai: "UAI", kdd: "KDD", arxiv: "arXiv",
  };

  // Only links and images on Lacuna itself are used, whatever the tool result holds.
  const urlOn = (value, origins) => {
    try {
      const url = new URL(value);
      return origins.includes(url.origin) ? url.href : null;
    } catch {
      return null;
    }
  };
  const lacunaUrl = (value) => urlOn(value, [LACUNA_ORIGIN]);
  const photoUrl = (value) => urlOn(value, [LACUNA_ORIGIN, MEDIA_ORIGIN]);

  // A link to a Lacuna page. The host opens it; the frame itself cannot navigate.
  const linkNode = (text, url) => {
    const link = document.createElement("a");
    link.href = url;
    link.textContent = text;
    link.onclick = (event) => {
      event.preventDefault();
      app.openLink({ url });
    };
    return link;
  };

  const plainText = (markdown) =>
    markdown
      .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/[*_`]+/g, "")
      .replace(/\s+/g, " ")
      .trim();

  // The summary as blocks: headings, paragraphs, lists, code and the figures
  // it embeds, in order.
  const markdownBlocks = (markdown) => {
    const blocks = [];
    let paragraph = [];
    let list = null;
    let code = null;
    const close = () => {
      if (paragraph.length) blocks.push({ kind: "p", text: paragraph.join(" ") });
      if (list) blocks.push(list);
      paragraph = [];
      list = null;
    };
    for (const raw of markdown.split("\n")) {
      const line = raw.trim();
      if (code) {
        if (line.startsWith("```")) {
          blocks.push(code);
          code = null;
        } else {
          code.lines.push(raw);
        }
        continue;
      }
      const heading = /^(#{1,6})\s+(.*)$/.exec(line);
      const image = /^!\[([^\]]*)\]\(([^)\s]+)\)$/.exec(line);
      // A figure is followed by a line that only links to its page in the PDF.
      const source = /^\*?\[([^\]]+)\]\([^)]*\)\*?$/.exec(line);
      const last = blocks[blocks.length - 1];
      const item = /^(?:[-*+]|(\d+)[.)])\s+(.*)$/.exec(line);
      if (line.startsWith("```")) {
        close();
        code = { kind: "pre", lines: [] };
      } else if (image) {
        close();
        blocks.push({ kind: "img", caption: image[1], url: image[2], source: "" });
      } else if (source && last?.kind === "img" && !paragraph.length && !list) {
        last.source = source[1];
      } else if (heading) {
        close();
        blocks.push({ kind: "h", level: heading[1].length, text: heading[2] });
      } else if (item) {
        const ordered = item[1] !== undefined;
        if (paragraph.length || (list && list.ordered !== ordered)) close();
        list ??= { kind: "list", ordered, items: [] };
        list.items.push(item[2]);
      } else if (!line) {
        close();
      } else if (list) {
        list.items[list.items.length - 1] += ` ${line}`;
      } else {
        paragraph.push(line);
      }
    }
    close();
    if (code) blocks.push(code);
    return blocks;
  };

  // The first paragraph under a "TL;DR" heading when the summary has one,
  // otherwise the first paragraph of the summary.
  const shortSummary = (blocks) => {
    const paragraphs = [];
    let heading = "";
    for (const block of blocks) {
      if (block.kind === "h") heading = block.text;
      else if (block.kind === "p") paragraphs.push({ heading, text: block.text });
    }
    const chosen = paragraphs.find((p) => /tl;?dr/i.test(p.heading)) ?? paragraphs[0];
    return chosen ? plainText(chosen.text).slice(0, 600) : "";
  };

  // The card does not typeset maths. It shows the source with the commonest
  // commands replaced by their symbols, which reads well for short formulas.
  const MATH_SYMBOLS = {
    alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", theta: "θ", lambda: "λ",
    mu: "μ", pi: "π", sigma: "σ", tau: "τ", phi: "φ", omega: "ω", eta: "η", rho: "ρ",
    Delta: "Δ", Theta: "Θ", Sigma: "Σ", Omega: "Ω", nabla: "∇", partial: "∂", infty: "∞",
    times: "×", cdot: "·", leq: "≤", geq: "≥", neq: "≠", approx: "≈", sim: "∼", in: "∈",
    to: "→", rightarrow: "→", leftarrow: "←", sum: "∑", prod: "∏", pm: "±", ll: "≪", gg: "≫",
  };
  const mathText = (source) =>
    source
      .replace(/\\(?:mathbf|mathrm|mathcal|mathbb|text|textbf|boldsymbol|operatorname)\{([^{}]*)\}/g, "$1")
      .replace(/\\([A-Za-z]+)/g, (command, name) => MATH_SYMBOLS[name] ?? command)
      .replace(/\s+/g, " ")
      .trim();

  // Bold, italic, code and maths become elements. A link to Lacuna stays a
  // link; any other keeps its text only.
  const appendInline = (parent, text) => {
    const pattern =
      /(\*\*[^*]+\*\*|\*[^*\s][^*]*\*|`[^`]+`|\[[^\]]+\]\([^)]*\)|\$\$[^$]+\$\$|\$[^\s$](?:[^$]*[^\s$])?\$)/;
    for (const part of text.split(pattern)) {
      if (!part) continue;
      let node;
      if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
        node = document.createElement("strong");
        appendInline(node, part.slice(2, -2));
      } else if (part.startsWith("`") && part.endsWith("`") && part.length > 2) {
        node = document.createElement("code");
        node.textContent = part.slice(1, -1);
      } else if (part.startsWith("$") && part.endsWith("$") && part.length > 2) {
        node = document.createElement("code");
        node.textContent = mathText(part.replace(/^\$+|\$+$/g, ""));
      } else if (part.startsWith("*") && part.endsWith("*") && part.length > 2) {
        node = document.createElement("em");
        appendInline(node, part.slice(1, -1));
      } else if (part.startsWith("[") && part.endsWith(")")) {
        const text = part.slice(1, part.indexOf("]("));
        const url = lacunaUrl(part.slice(part.indexOf("](") + 2, -1));
        node = url ? linkNode(text, url) : document.createTextNode(text);
      } else {
        node = document.createTextNode(part);
      }
      parent.append(node);
    }
  };

  const renderArticle = (blocks) => {
    const nodes = [];
    for (const [index, block] of blocks.entries()) {
      let node;
      if (block.kind === "h") {
        // The summary's own title repeats the card's headline in other words.
        if (index === 0 && block.level === 1) continue;
        node = document.createElement(block.level <= 2 ? "h2" : "h3");
        appendInline(node, block.text);
      } else if (block.kind === "p") {
        node = document.createElement("p");
        appendInline(node, block.text);
      } else if (block.kind === "img") {
        if (!lacunaUrl(block.url)) continue;
        node = figureNode(summaryFigure(block), block.source);
      } else if (block.kind === "list") {
        node = document.createElement(block.ordered ? "ol" : "ul");
        for (const item of block.items) {
          const li = document.createElement("li");
          appendInline(li, item);
          node.append(li);
        }
      } else {
        node = document.createElement("pre");
        node.textContent = block.lines.join("\n");
      }
      nodes.push(node);
    }
    $("article").replaceChildren(...nodes);
  };

  const venueAndYear = (paper) => {
    const venueKey = [paper.conference, paper.venue].find((value) => typeof value === "string") ?? "";
    const label = typeof paper.venue_label === "string" ? paper.venue_label : "";
    const venue = label || (VENUE_NAMES[venueKey.toLowerCase()] ?? venueKey);
    return [venue, paper.year].filter(Boolean).join(" ");
  };

  const byline = (paper) => {
    const names = (Array.isArray(paper.authors) ? paper.authors : [])
      .map((author) => (typeof author === "string" ? author : author?.name))
      .filter((name) => typeof name === "string");
    const shown = names.slice(0, 3).join(", ");
    const authors = names.length > 3 ? `${shown} and ${names.length - 3} more` : shown;
    return [authors, venueAndYear(paper)].filter(Boolean).join(" · ");
  };

  const figureLabel = (figure) =>
    typeof figure.title === "string" ? figure.title.split(" · ")[0] : "";
  // A figure's title ends with the title of the paper version it was cut from.
  const figureVersion = (figure) =>
    typeof figure.title === "string" ? figure.title.split(" · ").slice(1).join(" · ") : "";

  // Figures Lacuna has captioned first, then other figures, then tables. A
  // paper with two versions lists each figure twice; the copy from the other
  // version sits on the same page, so it is dropped.
  const usableFigures = (figures) => {
    const usable = (Array.isArray(figures) ? figures : []).filter(
      (figure) => figure && typeof figure === "object" && lacunaUrl(figure.url),
    );
    const rank = (figure) =>
      figure.kind !== "figure" ? 2 : figure.caption_origin === "extracted" ? 1 : 0;
    const ordered = [0, 1, 2].flatMap((value) => usable.filter((figure) => rank(figure) === value));
    const kept = [];
    for (const figure of ordered) {
      const copy = kept.some(
        (other) =>
          other.kind === figure.kind &&
          other.page === figure.page &&
          figureVersion(other) !== figureVersion(figure),
      );
      if (!copy) kept.push(figure);
    }
    return kept;
  };

  // A figure the summary embeds, in the shape of one from the figure list.
  const summaryFigure = (block) => ({
    url: block.url,
    kind: "figure",
    caption: block.caption,
    caption_origin: "summary",
    accessibility_alt: block.caption,
  });

  const figureNode = (figure, source = "") => {
    const node = document.createElement("figure");
    const image = document.createElement("img");
    const label = figureLabel(figure);
    // A caption Lacuna wrote says what the figure shows; an extracted one only names the page.
    const caption =
      figure.caption_origin !== "extracted" && typeof figure.caption === "string" ? figure.caption : "";
    image.src = lacunaUrl(figure.url);
    image.alt = typeof figure.accessibility_alt === "string" ? figure.accessibility_alt : label;
    image.onerror = () => {
      node.remove();
      if (figures.includes(figure)) {
        figures = figures.filter((other) => other !== figure);
        layOut();
      }
    };
    const text = document.createElement("figcaption");
    text.textContent = [[label, caption].filter(Boolean).join(": "), source].filter(Boolean).join(" · ");
    node.append(image, text);
    return node;
  };

  const app = new App(
    { name: "Lacuna Research card", version: "1.0.0" },
    { availableDisplayModes: ["inline", "fullscreen"] },
  );

  // What the card shows, built from one tool result by describe() below:
  // title, byline, summary, photo, url, blocks (the long text), sections
  // (titled lists of rows), and how many rows the card in the conversation shows.
  let card = null;
  let figures = [];
  let articleHasFigures = false;

  const setText = (id, text) => {
    $(id).textContent = text;
    $(id).hidden = !text;
  };

  const count = (value, one, many) =>
    Number.isInteger(value) ? `${value.toLocaleString("en")} ${value === 1 ? one : many}` : "";
  const text = (value) => (typeof value === "string" ? value : "");
  const LABELS = { github: "GitHub", huggingface: "Hugging Face", arxiv: "arXiv" };
  const label = (value) =>
    LABELS[text(value).toLowerCase()] ??
    text(value).replace(/_/g, " ").replace(/^./, (first) => first.toUpperCase());

  // Rows of a list: the text, a quieter note after it, and its page on Lacuna.
  const rows = (items, name, note, url) =>
    (Array.isArray(items) ? items : [])
      .filter((item) => item && typeof item === "object" && text(name(item)))
      .map((item) => ({
        text: name(item),
        note: note ? note(item) : "",
        url: lacunaUrl(url ? url(item) : item.url),
      }));
  const paperPage = (paper) =>
    paper.url ?? (text(paper.paper_id) ? `${LACUNA_ORIGIN}/paper/${paper.paper_id}` : null);
  const paperRows = (items) => rows(items, (paper) => paper.title, venueAndYear, paperPage);
  const authorRows = (items, note) => rows(items, (author) => author.name, note);
  const directionRows = (items, note) => rows(items, (direction) => direction.title, note);
  const paperCount = (item) => count(item.n_papers ?? item.paper_count ?? item.paper_hits, "paper", "papers");
  const section = (title, list) => ({ title, rows: list });

  const articleBlocks = (markdown) => (text(markdown) ? markdownBlocks(markdown) : []);
  // A card for one thing: its name, a line about it, and its long text.
  const entity = (payload, byline, markdown, sections, expandLabel) => {
    const blocks = articleBlocks(markdown);
    return {
      title: payload.title ?? payload.name,
      byline: byline.filter(Boolean).join(" · "),
      summary: shortSummary(blocks),
      url: lacunaUrl(payload.url),
      blocks,
      sections,
      shown: 3,
      expandLabel,
    };
  };
  const describe = (payload) => {
    const named = text(payload.title) || text(payload.name);
    if (payload.paper && typeof payload.paper === "object" && text(payload.paper.title)) {
      // A full-text window names its paper under "paper".
      const total = count(payload.total_chars, "character", "characters");
      return entity(payload.paper, ["Full text", total], "", [], "");
    }
    if (payload.type === "author" && named) {
      const profile = payload.profile && typeof payload.profile === "object" ? payload.profile : {};
      const papers = count(payload.n_papers, "paper on Lacuna", "papers on Lacuna");
      return {
        ...entity(payload, [text(profile.affiliation), papers], payload.profile_markdown, [
          section("Recent papers", paperRows(payload.papers)),
          section("Research directions", directionRows(payload.impact_directions)),
        ], "Read the profile"),
        photo: photoUrl(profile.photo_url),
      };
    }
    if (payload.type === "venue" && named) {
      return entity(payload, ["Venue", count(payload.paper_count, "paper", "papers")], "", [
        section("Representative papers", paperRows(payload.representative_papers)),
        section("Top directions", directionRows(payload.top_clusters, paperCount)),
        section("Top authors", authorRows(payload.top_authors, paperCount)),
      ], "Show more");
    }
    if (payload.type === "direction" && named) {
      return entity(payload, ["Research direction", paperCount(payload)], payload.summary_markdown, [
        // The people come first: the tool lists a direction's papers by title.
        section("Leading authors", authorRows(payload.authors ?? payload.top_author_profiles, (author) => text(author.affiliation))),
        section("Papers", paperRows(payload.papers)),
        section("Related directions", directionRows(payload.related_directions, paperCount)),
      ], "Read the overview");
    }
    if (payload.type === "hypothesis" && named) {
      return entity(payload, ["Hypothesis"], payload.summary_markdown, [
        section("Research directions", directionRows(payload.directions)),
      ], "Read the hypothesis");
    }
    if (payload.type === "institution" && named) {
      const size = [count(payload.n_authors, "author", "authors"), paperCount(payload)];
      return entity(payload, ["Institution", ...size], "", [
        section("Authors", authorRows(payload.authors, paperCount)),
      ], "Show more");
    }
    if (text(payload.provider) && text(payload.kind) && named) {
      const facets = payload.facets && typeof payload.facets === "object" ? payload.facets : {};
      const about = [label(payload.kind), label(payload.provider), text(facets.programming_language), text(facets.license)];
      return {
        ...entity(payload, about, "", [section("Papers", paperRows(payload.publications))], "Show more"),
        summary: plainText(text(payload.summary)).slice(0, 600),
      };
    }
    if (Array.isArray(payload.figures) && !named) {
      // The figures view of a paper: figures and nothing else.
      return {
        title: "Paper figures", byline: "", summary: "", url: null, blocks: [], sections: [],
        shown: 0, expandLabel: "", figures: usableFigures(payload.figures),
      };
    }
    if (!named) return null;
    // A paper. The short views carry an excerpt or the abstract instead of the summary.
    const paper = entity(payload, [byline(payload)], payload.summary_markdown, [], "Read the summary");
    const fallback = [payload.excerpt, payload.abstract].find((value) => text(value));
    const embedded = paper.blocks.filter((block) => block.kind === "img" && lacunaUrl(block.url));
    return {
      ...paper,
      summary: paper.summary || plainText(fallback ?? "").slice(0, 600),
      // The figures the summary chose come first; the figure list stands in
      // when it embeds none.
      figures: embedded.length
        ? embedded.map(summaryFigure)
        : usableFigures(payload.figures ?? (payload.figure ? [payload.figure] : [])),
      articleHasFigures: embedded.length > 0,
      paper: payload,
    };
  };

  // One titled list. Each row links to its page on Lacuna.
  const listing = (title, list) => {
    const node = document.createElement("div");
    node.className = "listing";
    if (title) {
      const heading = document.createElement("h2");
      heading.textContent = title;
      node.append(heading);
    }
    const items = document.createElement("ul");
    for (const row of list) {
      const item = document.createElement("li");
      item.append(row.url ? linkNode(row.text, row.url) : row.text);
      if (row.note) {
        const note = document.createElement("span");
        note.className = "where";
        note.textContent = ` · ${row.note}`;
        item.append(note);
      }
      items.append(item);
    }
    node.append(items);
    return node;
  };

  // The card shows the short summary with two figures or the start of one
  // list. Expanded, it shows the whole text, its figures and every list.
  const layOut = () => {
    const context = app.getHostContext();
    const expanded = context?.displayMode === "fullscreen";
    const canExpand = context?.availableDisplayModes?.includes("fullscreen") ?? false;
    document.body.classList.toggle("expanded", expanded);
    for (const edge of ["top", "right", "bottom", "left"]) {
      const inset = Number(context?.safeAreaInsets?.[edge]) || 0;
      document.body.style.setProperty(`--inset-${edge}`, `${inset}px`);
    }
    if (!card) return;
    const hasArticle = card.blocks.length > 1;
    // Expanded, a summary that embeds its figures shows them where it puts them.
    const inPlace = expanded && hasArticle && articleHasFigures;
    const shown = inPlace ? [] : expanded ? figures.slice(0, 1) : figures.slice(0, INLINE_FIGURES);
    const more = expanded && !inPlace ? figures.slice(1, EXPANDED_FIGURES) : [];
    $("figures").replaceChildren(...shown.map((figure) => figureNode(figure)));
    $("figures").classList.toggle("single", shown.length === 1);
    $("figures").hidden = shown.length === 0;
    $("more-figures").replaceChildren(...more.map((figure) => figureNode(figure)));
    $("more-figures").classList.toggle("single", more.length === 1);
    $("more-figures").hidden = more.length === 0;
    const sections = card.sections.filter((list) => list.rows.length);
    const first = expanded ? null : sections[0];
    $("short-list").replaceChildren(...(first ? [listing(first.title, first.rows.slice(0, card.shown))] : []));
    $("short-list").hidden = !first;
    const full = expanded ? sections.map((list) => listing(list.title, list.rows)) : [];
    $("full-list").replaceChildren(...full);
    $("full-list").hidden = full.length === 0;
    $("article").hidden = !(expanded && hasArticle);
    $("summary").hidden = !$("summary").textContent || (expanded && hasArticle);
    const hasMore =
      hasArticle || sections.length > 1 || (sections[0]?.rows.length ?? 0) > card.shown;
    $("expand").hidden = expanded || !canExpand || !hasMore || !card.expandLabel;
    $("actions").hidden = $("open").hidden && $("expand").hidden;
  };

  // The paper result lists a few figures and may start with tables. When it
  // names none of kind "figure" but the paper has more, ask Lacuna for the list.
  const loadMoreFigures = async (paper) => {
    const id = paper.artifact_id ?? paper.id;
    const listed = Array.isArray(paper.figures) ? paper.figures.length : 0;
    const hasFigure = figures.some((figure) => figure.kind === "figure");
    if (hasFigure || typeof id !== "string" || !(paper.figures_total > listed)) return;
    if (!app.getHostCapabilities()?.serverTools) return;
    try {
      const result = await app.callServerTool({
        name: "get_paper",
        arguments: { artifact_id_or_url: id, view: "figures" },
      });
      const more = usableFigures(result?.structuredContent?.figures);
      if (more.length) {
        figures = more;
        layOut();
      }
    } catch {
      // The card keeps the figures it already has.
    }
  };

  const show = (result) => {
    const payload = result?.structuredContent;
    card = payload && typeof payload === "object" ? describe(payload) : null;
    $("loading").hidden = true;
    $("entity").hidden = false;
    if (!card) {
      // A miss or an error: say so in one line, with the tool's own message.
      const said = (Array.isArray(result?.content) ? result.content : []).find((part) => text(part?.text));
      card = {
        title: "Nothing to show",
        byline: text(payload?.message) || text(said?.text).slice(0, 300),
        summary: "", url: null, blocks: [], sections: [], shown: 0, expandLabel: "",
      };
    }
    figures = card.figures ?? [];
    articleHasFigures = card.articleHasFigures ?? false;
    setText("title", card.title);
    setText("byline", card.byline);
    setText("summary", card.summary);
    $("photo").hidden = !card.photo;
    if (card.photo) {
      $("photo").src = card.photo;
      $("photo").alt = `Photo of ${card.title}`;
    }
    $("open").hidden = !card.url;
    $("expand").textContent = card.expandLabel || "Show more";
    if (card.blocks.length > 1) renderArticle(card.blocks);
    layOut();
    if (card.paper && !articleHasFigures) loadMoreFigures(card.paper);
  };

  const applyHostContext = (context) => {
    if (context?.theme) applyDocumentTheme(context.theme);
    if (context?.styles?.variables) applyHostStyleVariables(context.styles.variables);
    if (context?.styles?.css?.fonts) applyHostFonts(context.styles.css.fonts);
  };

  // Handlers go on before connect() so the first notifications are not missed.
  app.ontoolresult = show;
  app.onhostcontextchanged = (changed) => {
    applyHostContext(changed);
    layOut();
  };
  $("open").onclick = () => card?.url && app.openLink({ url: card.url });
  $("photo").onerror = () => {
    $("photo").hidden = true;
  };
  // Claude grants this only straight from a click, so nothing is awaited first.
  $("expand").onclick = () => app.requestDisplayMode({ mode: "fullscreen" }).then(layOut);

  await app.connect();
  applyHostContext(app.getHostContext());
  layOut();
</script>
</body>
</html>
